# main 的分支保護指定這個 workflow 的 test job 為必要檢查。
# 各步驟會依 repo 目前有什麼而自動啟用：functions/ 存在就跑型別檢查與單元測試，
# firestore.rules 存在就再跑一輪 emulator 的 Rules 測試。
# 部署是另一支 workflow（deploy.yml，workflow_dispatch + 打烊後排程），
# 刻意不放在這裡：見 docs/SPEC.md 第十節〈營業時間閘門〉。
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 偵測這次要跑哪些檢查
        id: detect
        run: |
          if [ -f functions/package.json ]; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
            echo "::notice::functions/ 尚未建立，略過測試"
          fi
          if [ -f firestore.rules ]; then
            echo "rules=true" >> "$GITHUB_OUTPUT"
          else
            echo "rules=false" >> "$GITHUB_OUTPUT"
            echo "::notice::firestore.rules 尚未建立，略過 Rules 測試"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.functions == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: 安裝相依套件
        if: steps.detect.outputs.functions == 'true'
        working-directory: functions
        run: npm ci

      - name: 型別檢查
        if: steps.detect.outputs.functions == 'true'
        working-directory: functions
        run: npm run typecheck

      - name: 單元測試（算價等純函式）
        if: steps.detect.outputs.functions == 'true'
        working-directory: functions
        run: npm test

      # Rules 測試要真的跑 Firestore emulator，emulator 需要 JVM。
      - uses: actions/setup-java@v4
        if: steps.detect.outputs.rules == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Emulator 測試（Security Rules）
        if: steps.detect.outputs.rules == 'true'
        working-directory: functions
        run: npm run test:rules

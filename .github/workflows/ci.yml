# main 的分支保護指定這個 workflow 的 test job 為必要檢查。
# 各步驟會依 repo 目前有什麼而自動啟用：functions/ 存在就跑型別檢查與單元測試，
# firestore.rules 存在就再跑一輪 emulator 測試（Security Rules 與觸發器），
# web/guest/ 存在就跑顧客網頁的型別檢查、單元測試與打包，
# android/ 存在就編譯平板 App 並跑它的單元測試。
# 全部放在同一個 test job 裡，是因為分支保護指名的必要檢查是這個 job；
# 拆成第二個 job 的話，除非有人去改 ruleset，否則它不會擋合併。
# 部署是另一支 workflow（deploy.yml，workflow_dispatch + 打烊後排程），
# 刻意不放在這裡：見 docs/SPEC.md 第十節〈營業時間閘門〉。
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # deploy.yml 的「測試不過不部署」直接重用這支，不另外維護一份檢查清單。
  workflow_call:

# github.workflow 是「觸發的那支 workflow 的名字」，被 deploy.yml 呼叫時會是 deploy。
# 少了它，部署時跑的這一輪會和 main 上的 ci 落在同一個 group，
# 被 cancel-in-progress 砍掉。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 偵測這次要跑哪些檢查
        id: detect
        run: |
          if [ -f functions/package.json ]; then
            echo "functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "functions=false" >> "$GITHUB_OUTPUT"
            echo "::notice::functions/ 尚未建立，略過測試"
          fi
          if [ -f firestore.rules ]; then
            echo "rules=true" >> "$GITHUB_OUTPUT"
          else
            echo "rules=false" >> "$GITHUB_OUTPUT"
            echo "::notice::firestore.rules 尚未建立，略過 emulator 測試"
          fi
          if [ -f web/guest/package.json ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "::notice::web/guest/ 尚未建立，略過顧客網頁檢查"
          fi
          if [ -f android/settings.gradle.kts ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
            echo "::notice::android/ 尚未建立，略過 App 建置"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.functions == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            web/guest/package-lock.json

      - name: 安裝相依套件
        if: steps.detect.outputs.functions == 'true'
        working-directory: functions
        run: npm ci

      - name: 型別檢查
        if: steps.detect.outputs.functions == 'true'
        working-directory: functions
        run: npm run typecheck

      # typecheck 用的 tsconfig.json 含 test/ 與設定檔，部署用的 tsconfig.build.json
      # 只含 src/，兩邊範圍不同，所以「typecheck 過」不等於「編得出來」。
      # 這一步在 PR 階段就把落差擋住，不要留到打烊後的部署才炸。
      - name: 編譯（部署用的產物）
        if: steps.detect.outputs.functions == 'true'
        working-directory: functions
        run: npm run build

      - name: 單元測試（算價等純函式）
        if: steps.detect.outputs.functions == 'true'
        working-directory: functions
        run: npm test

      # 顧客點餐網頁。setup-node 已經在上面設定好了（Node 22），這裡只要換目錄。
      # functions/ 不存在但 web/guest/ 存在的情況目前不會發生，真的發生時
      # 下面三步會因為沒有 node 而失敗，那是該修 workflow 的訊號，不是該靜默略過。
      - name: 安裝顧客網頁的相依套件
        if: steps.detect.outputs.web == 'true'
        working-directory: web/guest
        run: npm ci

      - name: 型別檢查（顧客網頁）
        if: steps.detect.outputs.web == 'true'
        working-directory: web/guest
        run: npm run typecheck

      - name: 單元測試（購物車與菜單）
        if: steps.detect.outputs.web == 'true'
        working-directory: web/guest
        run: npm test

      # 打包是真正的把關：JSX、import 路徑、型別以外的錯都會在這裡炸，
      # 而且部署時 firebase.json 的 predeploy 跑的就是同一個指令。
      - name: 打包顧客網頁
        if: steps.detect.outputs.web == 'true'
        working-directory: web/guest
        run: npm run build

      # Firestore emulator 與 Gradle 都要 JVM。
      # firebase-tools 15 起硬性要求 Java 21 以上（MIN_SUPPORTED_JAVA_MAJOR_VERSION），
      # 低於這個版本會直接以「no longer supports Java version before 21」結束，不要往下調。
      - uses: actions/setup-java@v4
        if: steps.detect.outputs.rules == 'true' || steps.detect.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Emulator 測試（Security Rules 與觸發器）
        if: steps.detect.outputs.rules == 'true'
        working-directory: functions
        run: npm run test:emulator

      # 平板 App。assembleDebug 是真正的把關：Compose、資源、manifest 有錯都會在這裡炸。
      - uses: gradle/actions/setup-gradle@v4
        if: steps.detect.outputs.android == 'true'

      - name: 建置平板 App
        if: steps.detect.outputs.android == 'true'
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
